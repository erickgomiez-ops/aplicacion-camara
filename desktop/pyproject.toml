[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-local"
version = "0.1.0"
description = "Asistente local de voz para Windows con integracion opcional de Codex"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "faster-whisper==1.2.1",
  "numpy>=1.26,<3",
  "Pillow>=11,<13",
  "pocketsphinx==5.0.4",
  "psutil>=6,<8",
  "pystray==0.19.5",
  "pywin32>=306,<312; platform_system == 'Windows'",
  "sounddevice==0.5.5",
  "winrt-runtime==3.2.1; platform_system == 'Windows'",
  "winrt-Windows.Foundation==3.2.1; platform_system == 'Windows'",
  "winrt-Windows.Foundation.Collections==3.2.1; platform_system == 'Windows'",
  "winrt-Windows.Media.SpeechSynthesis==3.2.1; platform_system == 'Windows'",
  "winrt-Windows.Storage.Streams==3.2.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[project.scripts]
jarvis-local = "jarvis_assistant.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
